name: Release images

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish (for example 0.1.0-rc.1)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CONTROL_PLANE_IMAGE: ${{ github.repository_owner }}/opencode-workspaces-control-plane
  WORKSPACE_IMAGE: ${{ github.repository_owner }}/opencode-workspaces-workspace

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve image version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  registry-access:
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - name: Verify GHCR push access
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          ACTOR: ${{ github.actor }}
        run: |
          for image in opencode-workspaces-control-plane opencode-workspaces-workspace; do
            repository="$OWNER/$image"
            token="$(curl --fail --silent --show-error \
              --user "$ACTOR:$GHCR_TOKEN" \
              "https://ghcr.io/token?service=ghcr.io&scope=repository:$repository:pull,push" \
              | jq -r '.token')"

            headers="$(mktemp)"
            http_status="$(curl --silent --show-error --output /dev/null \
              --dump-header "$headers" --write-out '%{http_code}' \
              --request POST --header "Authorization: Bearer $token" \
              "https://ghcr.io/v2/$repository/blobs/uploads/")"
            upload_url="$(awk 'tolower($1) == "location:" {$1=""; sub(/^ /, ""); print}' \
              "$headers" | tr -d '\r' | tail -1)"
            unlink "$headers"

            if [[ "$http_status" != 202 || -z "$upload_url" ]]; then
              echo "GITHUB_TOKEN does not have GHCR push access to $repository" >&2
              exit 1
            fi
            if [[ "$upload_url" == /* ]]; then
              upload_url="https://ghcr.io$upload_url"
            fi
            curl --silent --show-error --output /dev/null --request DELETE \
              --header "Authorization: Bearer $token" "$upload_url" || true
          done

  build:
    needs: [metadata, registry-access]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: control-plane
            image: opencode-workspaces-control-plane
            dockerfile: build/Dockerfile.control-plane
          - name: workspace
            image: opencode-workspaces-workspace
            dockerfile: build/Dockerfile.workspace
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}:${{ needs.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
