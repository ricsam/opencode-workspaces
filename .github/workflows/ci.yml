name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build ./cmd/server
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/opencode-workspaces
      - run: helm template verify charts/opencode-workspaces --namespace verify > rendered.yaml
      - uses: azure/setup-kubectl@v4
      - run: kubectl apply --dry-run=client -f rendered.yaml
  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: make test-patches
      - run: make opencode-verify
  images:
    runs-on: ubuntu-latest
    needs: [go, helm, opencode]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.control-plane
          push: false
          tags: opencode-workspaces-control-plane:test
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.workspace
          push: false
          tags: opencode-workspaces-workspace:test
