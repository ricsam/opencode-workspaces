{{- if not .Values.existingSecret }}
{{- $name := include "opencode-workspaces.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opencode-workspaces.labels" . | nindent 4 }}
type: Opaque
data:
  session-secret: {{ if $existing }}{{ index $existing.data "session-secret" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  encryption-key: {{ if $existing }}{{ index $existing.data "encryption-key" }}{{ else }}{{ randAlphaNum 64 | b64enc }}{{ end }}
  {{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
  postgres-password: {{ if $existing }}{{ index $existing.data "postgres-password" }}{{ else }}{{ randAlphaNum 40 | b64enc }}{{ end }}
  {{- end }}
{{- end }}
