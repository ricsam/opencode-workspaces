{{define "content"}}<section class="auth card"><p class="eyebrow">Secure workspace</p><h1>Sign in</h1>{{if .Error}}<div class="error">{{.Error}}</div>{{end}}<form method="post" action="/platform/login" class="stack"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form>{{if .OIDC.Enabled}}<div class="divider">or</div><a class="button secondary" href="/platform/auth/oidc/login">Continue with single sign-on</a>{{end}}</section>{{end}}
