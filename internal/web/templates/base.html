{{define "base"}}<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>{{if .Title}}{{.Title}} · {{end}}{{.Brand.Name}}</title><link rel="stylesheet" href="/platform/static/app.css">{{if .Brand.Favicon}}<link rel="icon" href="{{.Brand.Favicon}}">{{end}}<style>:root{--accent:{{.Brand.Accent}}}</style></head>
<body><header><a class="brand" href="/platform/">{{if .Brand.LogoURL}}<img src="{{.Brand.LogoURL}}" alt="">{{end}}{{.Brand.Name}}</a>{{if .User.ID}}<nav><a href="/">OpenCode</a>{{if .User.IsAdmin}}<a href="/platform/admin">Admin</a>{{end}}<form method="post" action="/platform/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link">Sign out</button></form></nav>{{end}}</header><main>{{template "content" .}}</main></body></html>{{end}}
