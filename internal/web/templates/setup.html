{{define "content"}}<section class="auth card"><p class="eyebrow">First-run setup</p><h1>Create the administrator</h1><p>The first completed registration becomes the administrator. Choose a unique username and a password of at least 12 characters.</p>{{if .Error}}<div class="error">{{.Error}}</div>{{end}}<form method="post" action="/platform/setup" class="stack"><input type="hidden" name="csrf" value="{{.CSRF}}"><label>Username<input name="username" autocomplete="username" required autofocus pattern="[A-Za-z0-9._-]{2,64}"></label><label>Display name<input name="display_name" maxlength="120"></label><label>Email<input type="email" name="email" autocomplete="email"></label><label>Password<input type="password" name="password" autocomplete="new-password" minlength="12" required></label><button type="submit">Create administrator</button></form></section>{{end}}
